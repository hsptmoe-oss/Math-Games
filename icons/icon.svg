<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="12"/>
  
  <!-- Owl / Mascot Head -->
  <circle cx="256" cy="275" r="140" fill="#1e1b4b"/>
  
  <!-- Owl Big Eyes -->
  <circle cx="205" cy="245" r="48" fill="#ffffff"/>
  <circle cx="307" cy="245" r="48" fill="#ffffff"/>
  <circle cx="215" cy="245" r="24" fill="#0f172a"/>
  <circle cx="297" cy="245" r="24" fill="#0f172a"/>
  <circle cx="223" cy="235" r="8" fill="#ffffff"/>
  <circle cx="305" cy="235" r="8" fill="#ffffff"/>
  
  <!-- Cute Beak -->
  <polygon points="256,275 238,310 274,310" fill="#fbbf24"/>
  
  <!-- Graduation / Math Cap -->
  <polygon points="256,110 370,165 256,205 142,165" fill="#f59e0b"/>
  <polygon points="256,170 330,195 330,225 256,245 182,225 182,195" fill="#d97706"/>
  <line x1="340" y1="180" x2="355" y2="245" stroke="#ef4444" stroke-width="6"/>
  <circle cx="355" cy="250" r="10" fill="#ef4444"/>
  
  <!-- Math Symbols Badge -->
  <g font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="#38bdf8" text-anchor="middle">
    <text x="100" y="320">➕</text>
    <text x="415" y="320">✖️</text>
    <text x="100" y="440">➗</text>
    <text x="415" y="440">🟰</text>
  </g>
  
  <!-- Text Label -->
  <text x="256" y="465" font-family="'Battambang', sans-serif" font-weight="700" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    គណិតវិទ្យា
  </text>
</svg>
